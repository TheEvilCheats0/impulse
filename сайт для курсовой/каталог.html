<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IMPULSE | Исторические коллекции</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="impulse.css">
  <link rel="stylesheet" href="impulse2.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/line-awesome/1.3.0/line-awesome/css/line-awesome.min.css">
</head>
<body>
  <header class="glass-header">
    <div class="container">
      <a href="impulse.html" class="logo hologram-text">IMPULSE</a>
      <nav class="hologram-nav">
        <!-- Добавьте пункты меню, если нужно -->
      </nav>
      <button class="cart-toggle" id="openCartBtn">
        <i class="las la-shopping-cart"></i>
        <span class="cart-count" id="cartCount">0</span>
      </button>
    </div>
  </header>

  <main class="catalog-page">
    <section class="catalog-header">
      <div class="container">
        <h1>Исторические коллекции</h1>
        <div class="catalog-controls">
          <div class="view-switcher">
            <button class="view-btn active" data-view="grid"><i class="las la-th-large"></i></button>
            <button class="view-btn" data-view="list"><i class="las la-list"></i></button>
          </div>
          <div class="sort-filter">
            <!-- Фильтры или сортировка -->
          </div>
        </div>
      </div>
    </section>

    <section class="product-grid">
      <div class="container">
        <div class="grid-layout">
          <article class="product-card">
            <div class="product-media">
              <img src="img/410c85b1-a0fe-45c2-80d3-8d4dbaa5bbcc.jpg" alt="Gucci 2023">
              <button class="quick-view"><i class="las la-expand"></i></button>
            </div>
            <div class="product-details">
              <h3>рубашка</h3>
  
              <div class="price-wrapper">
                <span class="price">$90</span>
                <button class="add-to-cart" data-name="платье" data-price="90" data-image="img/2-Gucci-Spring-Summer-2023-Twinsburg-Runway-Magazine.webp">
                  <i class="las la-shopping-cart"></i>
                </button>
              </div>
            </div>
          </article>

          <article class="product-card">
            <div class="product-media">
              <img src="img/071bd46f-304f-4eb3-bc55-a236e33d0045.jpg" alt="Prada 2022">
              <button class="quick-view"><i class="las la-expand"></i></button>
            </div>
            <div class="product-details">
              <h3>свитер</h3>
          
              <div class="price-wrapper">
                <span class="price">$120</span>
                <button class="add-to-cart" data-name="Prada 2022" data-price="950" data-image="img/vechernee_platye_prada.jpg">
                  <i class="las la-shopping-cart"></i>
                </button>
              </div>
            </div>
          </article>

          <article class="product-card">
            <div class="product-media">
              <img src="img/Без назва333333ния (1).jpg" alt="Chanel 2021">
              <button class="quick-view"><i class="las la-expand"></i></button>
            </div>
            <div class="product-details">
              <h3>футболка</h3>
             
              <div class="price-wrapper">
                <span class="price">$60</span>
                <button class="add-to-cart" data-name="Chanel 2021" data-price="1100" data-image="img/9-Chanel-Haute-Couture-Spring-Summer-2021-by-RUNWAY-MAGAZINE.webp">
                  <i class="las la-shopping-cart"></i>
                </button>
              </div>
            </div>
          </article>
        </div>
      </div>
    </section>
  </main>

  <div class="cart-modal" id="cartModal">
    <div class="cart-content">
      <div class="cart-header">
        <h2>Корзина</h2>
        <button class="close-cart" id="closeCartBtn"><i class="las la-times"></i></button>
      </div>
      <div class="cart-items" id="cartItems"></div>
      <div class="cart-footer">
        <div class="cart-total">
          <span>Итого:</span>
          <span id="cartTotal">$0</span>
        </div>
        <button class="checkout-btn">Оформить заказ</button>
      </div>
    </div>
  </div>

  <footer class="neon-footer">
    <div class="container">
      <p>© 2025 IMPULSE. Все права защищены.</p>
    </div>
  </footer>

  <script src="impulse.js"></script>
  <script>
    // Инициализация корзины из localStorage
    let cart = JSON.parse(localStorage.getItem('cart')) || [];

    // Обновление отображения корзины
    function updateCart() {
      const cartItems = document.getElementById('cartItems');
      const cartTotal = document.getElementById('cartTotal');
      const cartCount = document.getElementById('cartCount');
      cartItems.innerHTML = '';

      let total = 0;
      cart.forEach((item, index) => {
        total += item.price * item.quantity;
        cartItems.innerHTML += `
          <div class="cart-item" data-index="${index}">
            <img src="${item.image}" alt="${item.name}">
            <div class="cart-item-details">
              <h3>${item.name}</h3>
              <span class="price">$${item.price}</span>
            </div>
            <div class="cart-item-controls">
              <button class="quantity-btn" onclick="changeQuantity(${index}, -1)">-</button>
              <input type="number" class="cart-item-quantity" value="${item.quantity}" readonly>
              <button class="quantity-btn" onclick="changeQuantity(${index}, 1)">+</button>
              <button class="remove-item" onclick="removeFromCart(${index})"><i class="las la-trash"></i></button>
            </div>
          </div>
        `;
      });

      cartTotal.textContent = `$${total.toFixed(2)}`;
      cartCount.textContent = cart.reduce((sum, item) => sum + item.quantity, 0);
      localStorage.setItem('cart', JSON.stringify(cart));
    }

    // Добавление товара в корзину
    function addToCart(name, price, image) {
      const existingItem = cart.find(item => item.name === name);
      if (existingItem) {
        existingItem.quantity += 1;
      } else {
        cart.push({ name, price: parseFloat(price), image, quantity: 1 });
      }
      updateCart();
      document.getElementById('cartModal').style.display = 'flex';
    }

    // Изменение количества
    function changeQuantity(index, change) {
      if (cart[index].quantity + change > 0) {
        cart[index].quantity += change;
        updateCart();
      }
    }

    // Удаление товара
    function removeFromCart(index) {
      cart.splice(index, 1);
      updateCart();
    }

    // Обработчики кнопок "Добавить в корзину"
    document.querySelectorAll('.add-to-cart').forEach(button => {
      button.addEventListener('click', () => {
        const name = button.getAttribute('data-name');
        const price = button.getAttribute('data-price');
        const image = button.getAttribute('data-image');
        addToCart(name, price, image);
      });
    });

    // Переключение вида каталога
    document.querySelectorAll('.view-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelector('.view-btn.active').classList.remove('active');
        btn.classList.add('active');
        const layout = btn.dataset.view;
        document.querySelector('.grid-layout').className = `grid-layout ${layout}-view`;
      });
    });

    // Открытие/закрытие корзины
    const cartModal = document.getElementById('cartModal');
    const openCartBtn = document.getElementById('openCartBtn');
    const closeCartBtn = document.getElementById('closeCartBtn');

    openCartBtn.addEventListener('click', () => {
      cartModal.style.display = 'flex';
    });

    closeCartBtn.addEventListener('click', () => {
      cartModal.style.display = 'none';
    });

    window.addEventListener('click', (e) => {
      if (e.target === cartModal) {
        cartModal.style.display = 'none';
      }
    });

    // Инициализация при загрузке
    updateCart();
  </script>
</body>
</html>
